name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libncurses5:i386 zip unzip zlib1g-dev openjdk-17-jdk
          pip install --upgrade pip setuptools buildozer cython

      - name: Build APK with 16 KB Page Alignment
        run: |
          # Clean p4a build cache to force re-compilation of recipes with new p4a flags
          buildozer android clean
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-app
          path: ./bin/*.apk
