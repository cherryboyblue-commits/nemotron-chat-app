name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libncurses5:i386 zip unzip zlib1g-dev openjdk-17-jdk
          pip install --upgrade pip setuptools buildozer cython

      - name: Build APK with 16 KB Page Alignment
        env:
          CFLAGS: "-O2 -Wl,-z,max-page-size=16384"
          CXXFLAGS: "-O2 -Wl,-z,max-page-size=16384"
          LDFLAGS: "-Wl,-z,max-page-size=16384"
          APP_ANDROID_P4A_EXTRA_ARGS: "--cflags='-Wl,-z,max-page-size=16384' --ldflags='-Wl,-z,max-page-size=16384'"
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-app
          path: ./bin/*.apk
